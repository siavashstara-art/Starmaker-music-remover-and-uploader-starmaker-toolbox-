<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4" />
  
  <!-- Microphone Body -->
  <rect x="206" y="110" width="100" height="170" rx="50" fill="url(#goldGrad)" />
  <!-- Mic grid lines -->
  <line x1="206" y1="170" x2="306" y2="170" stroke="#78350F" stroke-width="4" />
  <line x1="206" y1="210" x2="306" y2="210" stroke="#78350F" stroke-width="4" />
  
  <!-- U-shape cradle -->
  <path d="M 166 220 C 166 315, 346 315, 346 220" fill="none" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
  <!-- Stand -->
  <line x1="256" y1="315" x2="256" y2="385" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />
  <line x1="186" y1="385" x2="326" y2="385" stroke="url(#goldGrad)" stroke-width="16" stroke-linecap="round" />

  <!-- Star accents -->
  <polygon points="120,130 128,150 150,150 132,162 138,182 120,170 102,182 108,162 90,150 112,150" fill="#FBBF24" />
  <polygon points="390,130 398,150 420,150 402,162 408,182 390,170 372,182 378,162 360,150 382,150" fill="#FBBF24" />
</svg>
